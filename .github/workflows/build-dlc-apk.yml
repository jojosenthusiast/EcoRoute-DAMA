name: Build DLC Android APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ dlc-apk-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project shell
        run: |
          flutter create --platforms=android --org com.dlcelsalvador dlc_build
          rm -rf dlc_build/lib
          cp -R apk_source/lib dlc_build/lib
          cp apk_source/pubspec.yaml dlc_build/pubspec.yaml
          rm -rf dlc_build/test
          rm -f dlc_build/analysis_options.yaml

      - name: Install dependencies
        working-directory: dlc_build
        run: flutter pub get

      - name: Analyze
        working-directory: dlc_build
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: dlc_build
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLC-El-Salvador-APK
          path: dlc_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload full Flutter project
        uses: actions/upload-artifact@v4
        with:
          name: DLC-El-Salvador-Flutter-Project
          path: |
            dlc_build/**
            !dlc_build/build/**
            !dlc_build/.dart_tool/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
